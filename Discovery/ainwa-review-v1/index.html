<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AINWA Control Center</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f3;--panel:#fff;--text:#15191d;--muted:#687078;--line:#d4d8d5;--soft:#eef0ed;--red:#b42318;--orange:#b54708;--blue:#175cd3;--gray:#667085}@media(prefers-color-scheme:dark){:root{--bg:#101312;--panel:#191d1b;--text:#f2f4f3;--muted:#adb5b0;--line:#39403c;--soft:#242a27;--red:#f97066;--orange:#fdb022;--blue:#53b1fd;--gray:#98a2b3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 10px;font-weight:700}.primary{background:var(--text);color:var(--panel);border-color:var(--text)}.danger{color:var(--red)}header{min-height:68px;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}header h1{font-size:16px;margin:0}.master{display:flex;gap:6px;flex-wrap:wrap}.spacer{flex:1}.usage{font-size:11px;color:var(--muted)}.board{display:grid;grid-template-columns:18fr 18fr 18fr 46fr;height:calc(100vh - 106px);min-height:540px}.column{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-width:0}.column-head{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:9px;display:flex;align-items:center;gap:5px}.column-head strong{flex:1}.column-head button{font-size:10px;padding:4px}.empty{padding:24px 10px;color:var(--muted);text-align:center}.story{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:10px;background:transparent;font-weight:400}.story:hover,.story.active{background:var(--soft)}.story.critical{border-left:5px solid var(--red)}.story.high{border-left:5px solid var(--orange)}.story.medium{border-left:5px solid var(--blue)}.story.low{border-left:5px solid var(--gray)}.story.headliner{outline:2px solid var(--red);outline-offset:-3px}.meta{font-size:10px;text-transform:uppercase;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap}.title{font-weight:750;margin:4px 0}.source{font-size:11px;color:var(--muted)}.headliner-label{color:var(--red);font-weight:900}.editor{padding:18px;max-width:980px;margin:auto}.editor h2{font:800 28px/1.1 Georgia,serif}.source-row{display:flex;justify-content:space-between;border-block:1px solid var(--line);padding:10px 0;margin:12px 0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.fact{border:1px solid var(--line);padding:8px}.fact span{display:block;color:var(--muted);font-size:10px}.actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);margin:20px -18px -18px;padding:12px 18px;display:flex;gap:7px;flex-wrap:wrap}footer{min-height:38px;border-top:1px solid var(--line);background:var(--panel);padding:6px 14px;color:var(--muted);font-size:12px;display:grid;grid-template-columns:1fr minmax(280px,2fr) 1fr;align-items:center;gap:12px}footer button{font-size:10px;padding:4px 7px}.footer-status{text-align:center;font-weight:700;white-space:normal;overflow-wrap:anywhere}.server-controls{display:flex;align-items:center;justify-self:end;gap:5px;border-left:1px solid var(--line);padding-left:10px}.server-controls strong{font-size:10px;text-transform:uppercase}dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);width:min(760px,94vw);padding:0}dialog.wide{width:min(1100px,96vw)}dialog::backdrop{background:#0009}.dialog-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:850}.dialog-body{padding:16px;max-height:70vh;overflow:auto}.dialog-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}label{display:block;font-size:11px;font-weight:800;margin:9px 0 4px}input,textarea,select{width:100%;border:1px solid var(--line);background:var(--panel);padding:8px}textarea{min-height:110px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.checks label{display:flex;gap:5px;margin:0}.checks input{width:auto}.queue-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:10px}.queue-row input{width:auto}.mobile-tabs{display:none}@media(max-width:800px){.mobile-tabs{display:flex;padding:7px}.mobile-tabs button{flex:1}.board{display:block;height:auto}.column{display:none;min-height:250px}.column.mobile-active,.column.editorial{display:block}.facts{grid-template-columns:1fr 1fr}footer{grid-template-columns:1fr}.footer-status{text-align:left}.server-controls{justify-self:start;border-left:0;padding-left:0}}
</style></head><body>
<header><h1>AINWA CONTROL CENTER</h1><div class="master"><button id="sourceBtn" onclick="sourceStories()">Source</button><button id="recoverBtn" onclick="recoverScan()">Load Last Scan</button><button onclick="manualAdd()">Manually Add</button><button onclick="openQueue()"><span id="pqCount">0</span> Open Queue <span id="pqApproved">0</span></button><button onclick="lazyUpdate()">Lazy Update</button><button class="primary" id="publishMasterBtn" onclick="publishApproved()">Publish</button></div><div class="spacer"></div><div class="usage" id="usage">AI usage…</div></header>
<div class="mobile-tabs"><button onclick="mobile('scanned')">Scanned</button><button onclick="mobile('candidates')">Candidates</button><button onclick="mobile('standby')">Standby</button></div>
<div class="board"><section class="column mobile-active" data-col="scanned"><div class="column-head"><strong>Scanned · <span id="scannedCount">0</span></strong><button onclick="clearCol('scanned')">Clear Scanned</button></div><div id="scannedList"></div></section><section class="column" data-col="candidates"><div class="column-head"><strong>Candidates · <span id="candidatesCount">0</span></strong><button onclick="clearCol('candidates')">Clear Candidates</button></div><div id="candidatesList"></div></section><section class="column" data-col="standby"><div class="column-head"><strong>Standby · <span id="standbyCount">0</span></strong><button onclick="clearCol('standby')">Clear Standby</button></div><div id="standbyList"></div></section><main class="column editorial"><div class="column-head"><strong>Editorial</strong></div><div id="editor" class="editor"><div class="empty">Select a story from any column.</div></div></main></div><footer><span id="operation">Ready</span><span id="result" class="footer-status" role="status" aria-live="polite"></span><div class="server-controls"><strong>Server Controls</strong><button onclick="restartServer()">Restart Server</button><button class="danger" onclick="killServer()">Kill Server</button></div></footer>
<dialog id="editDialog"><div class="dialog-head">Edit / Select for Publication</div><div class="dialog-body"><label>Original Headline</label><div id="eOriginal" class="source-row"></div><label>Story Date</label><div id="eDate" class="source-row"></div><label>AINWA Headline — 4–8 words</label><input id="eHeadline"><label>Tooltip bullets — 3–4 lines, 6–12 words each</label><textarea id="eSummary"></textarea><button onclick="generateTooltip()">Generate Tooltip and Headline</button><label>Category</label><input id="eCategory"><label>Social tags</label><input id="eTags"><label>Importance</label><select id="ePriority"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select><div class="checks"><label><input type="checkbox" id="eTop"> Headliner</label><label><input type="checkbox" id="eDev"> Developing</label><label><input type="checkbox" id="ePay"> Paywall $</label><label><input type="checkbox" id="eAck"> Limited evidence acknowledged</label></div></div><div class="dialog-foot"><button onclick="editDialog.close()">Cancel</button><button class="primary" onclick="queueStory()">Approve to Publish Queue</button></div></dialog>
<dialog class="wide" id="publishDialog"><div class="dialog-head">Publish Queue</div><div class="dialog-body" id="publishRows"></div><div class="dialog-foot"><button class="danger" onclick="clearQueue()">Clear Queue</button><button class="primary" onclick="approveQueue()">Approve Queue</button></div></dialog>
<script>
let state,csrf,selected,operationTimer;const q=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const src=s=>s.source||s.primary_source||{},prop=s=>s.proposal||{},sum=s=>{let x=prop(s).public_summary||prop(s).summary||[];return Array.isArray(x)?x:[x]},storyDate=s=>{let raw=String(s.published_at||s.discovered_at||'').slice(0,10);if(!raw)return'Unknown';let d=new Date(raw+'T00:00:00');return Number.isNaN(d.valueOf())?raw:d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})};
async function api(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-AINWA-CSRF-Token':csrf||''},body:JSON.stringify(body)}),o=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok){let e=Error(o.error||'Request failed');e.details=o.output||'';throw e}return o}
async function load(){let r=await fetch('/api/control',{cache:'no-store'}),o=await r.json();if(!r.ok)throw Error(o.error);state=o;csrf=o.csrf_token;q('pqCount').textContent=o.counts.publish_queue;q('pqApproved').textContent=o.publish_approved_count;q('publishMasterBtn').disabled=!o.publish_approved_count;['scanned','candidates','standby'].forEach(n=>{q(n+'Count').textContent=o.counts[n];renderList(n)});let u=o.ai_usage_today;q('usage').textContent=`Today: ${u.input_tokens} in · ${u.output_tokens} out${u.estimated_cost?` · est. $${Number(u.estimated_cost).toFixed(2)}`:''}`;let op=o.operation||{},elapsed=op.running&&op.started_at?Math.max(0,Math.floor((Date.now()-Date.parse(op.started_at))/1000)):null;q('operation').textContent=(op.message||'Ready')+(elapsed===null?'':` · ${elapsed}s`);q('sourceBtn').disabled=!!op.running;q('recoverBtn').disabled=!!op.running;if(op.running)watchOperation();if(selected){let f=find(selected.id);if(f){selected=f.story;renderEditor(f.location,f.story)}else selected=null}}
function watchOperation(){if(operationTimer)return;operationTimer=setInterval(async()=>{try{await load();if(!state.operation.running){clearInterval(operationTimer);operationTimer=null}}catch(e){q('result').textContent=e.message}},1000)}
function renderList(n){q(n+'List').innerHTML=state[n].length?state[n].map(s=>{let p=prop(s),x=src(s),pri=p.priority||s.importance||'Medium';return `<button class="story ${String(pri).toLowerCase()} ${p.top_story?'headliner':''} ${selected&&selected.id===s.id?'active':''}" onclick="choose('${n}','${esc(s.id)}')"><div class="meta"><span>${esc(pri)}</span><span>${esc((s.published_at||s.discovered_at||'').slice(0,10))}</span>${x.paywall?'<span>$</span>':''}${p.top_story?'<span class="headliner-label">HEADLINER</span>':''}</div><div class="title">${esc(p.brief_headline||p.headline||s.original_headline||'Untitled')}</div><div class="source">${esc(x.name||'Unknown source')}</div></button>`}).join(''):'<div class="empty">No stories</div>'}
function find(id){for(let location of ['scanned','candidates','standby','publish_queue']){let story=state[location].find(s=>String(s.id)===String(id));if(story)return{location,story}}}function choose(location,id){selected=state[location].find(s=>String(s.id)===String(id));renderEditor(location,selected);['scanned','candidates','standby'].forEach(renderList)}
function renderEditor(location,s){let p=prop(s),x=src(s),bul=sum(s),moves=location==='scanned'?`<button onclick="move('candidates')">Move to Candidates</button><button onclick="move('standby')">Move to Standby</button>`:location==='candidates'?`<button onclick="move('standby')">Move to Standby</button><button onclick="move('scanned')">Return to Scanned</button>`:'';q('editor').innerHTML=`<article><div class="meta">${esc(location)} · ${esc(p.priority||'Medium')} ${x.paywall?'· $ PAYWALL':''}</div><div class="source-row"><strong>${esc(x.name||'')}</strong>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Open source ↗</a>`:''}</div><small>ORIGINAL HEADLINE</small><p>${esc(s.original_headline||'')}</p><h2>${esc(p.brief_headline||p.headline||s.original_headline||'Untitled')}</h2>${bul.length?`<ul>${bul.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:'<div class="empty">Generate tooltip during publication editing.</div>'}<div class="facts"><div class="fact"><span>Category</span>${esc(p.category||'—')}</div><div class="fact"><span>Importance</span>${esc(p.priority||'—')}</div><div class="fact"><span>Headliner</span>${p.top_story?'Yes':'No'}</div><div class="fact"><span>Developing</span>${p.developing?'Yes':'No'}</div></div><div class="actions"><button class="primary" onclick="edit()">Edit / Select for Publication</button>${moves}<button class="danger" onclick="reject()">Reject</button></div></article>`}
async function move(destination){await api('/api/control/move',{id:selected.id,destination});await load()}async function reject(){if(confirm('Reject and permanently suppress this exact story?')){await api('/api/control/reject',{id:selected.id,reason:'human rejection'});selected=null;await load()}}async function clearCol(location){let count=state.counts[location],outcome=location==='standby'?'return to Candidates':'return to sourcing history';if(confirm(`Clear ${count} ${location} stories? They will ${outcome}.`)){await api('/api/control/clear',{location});selected=null;await load()}}
const wordCount=s=>(String(s||'').match(/[\w’'-]+/g)||[]).length;
function edit(){let p=prop(selected),x=src(selected);q('eOriginal').textContent=selected.original_headline||'';q('eDate').textContent=storyDate(selected);q('eHeadline').value=p.brief_headline||p.headline||selected.original_headline||'';q('eSummary').value=sum(selected).join('\n');q('eCategory').value=p.category||'';q('eTags').value=(p.social_tags||[]).join(' ');q('ePriority').value=['Critical','High','Medium','Low'].includes(p.priority)?p.priority:'Medium';q('eTop').checked=!!p.top_story;q('eDev').checked=!!p.developing;q('ePay').checked=!!x.paywall;q('eAck').checked=!!p.limited_evidence_acknowledged;editDialog.showModal()}
async function generateTooltip(){q('result').textContent='Generating tooltip and headline…';let o=await api('/api/control/generate-tooltip',{id:selected.id,evidence_scope:q('ePay').checked?'headline_or_excerpt':'available_article_evidence'}),g=o.generated;q('eHeadline').value=g.brief_headline;q('eSummary').value=g.public_summary.join('\n');q('eCategory').value=g.category||'';q('eTags').value=(g.social_tags||[]).join(' ');q('ePriority').value=g.priority;q('eTop').checked=!!g.top_story;q('eDev').checked=!!g.developing;q('result').textContent='Generated; review before approval.'}
async function queueStory(){if(q('ePay').checked&&!q('eAck').checked)return alert('Acknowledge limited evidence first.');let edits={brief_headline:q('eHeadline').value.trim(),headline:q('eHeadline').value.trim(),public_summary:q('eSummary').value.split('\n').map(x=>x.trim()).filter(Boolean),category:q('eCategory').value.trim(),social_tags:q('eTags').value.split(/\s+/).filter(Boolean),priority:q('ePriority').value,top_story:q('eTop').checked,developing:q('eDev').checked,paywall:q('ePay').checked,limited_evidence_acknowledged:q('eAck').checked};if(wordCount(edits.brief_headline)<4||wordCount(edits.brief_headline)>8)return alert('AINWA Headline must contain 4–8 words.');if(edits.public_summary.length<3||edits.public_summary.length>4)return alert('Enter 3–4 tooltip bullets.');if(edits.public_summary.some(x=>wordCount(x)<6||wordCount(x)>12))return alert('Each tooltip bullet must contain 6–12 words.');await api('/api/control/edit',{id:selected.id,edits});await api('/api/control/move',{id:selected.id,destination:'publish_queue'});editDialog.close();selected=null;await load();openQueue()}
function openQueue(){q('publishRows').innerHTML=`<div class="source">Currently published: ${state.published_count} stories · ${state.publish_approved_count} approved to publish</div>`+(state.publish_queue.length?state.publish_queue.map(s=>`<div class="queue-row"><input type="checkbox" class="pub" value="${esc(s.id)}" ${s.publish_approved?'checked':''}><div><strong>${esc(prop(s).brief_headline||prop(s).headline||s.original_headline)}</strong><div class="source">${esc(src(s).name||'')} · ${esc((s.published_at||s.discovered_at||'').slice(0,10))} ${src(s).paywall?'· $':''}</div><ul>${sum(s).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div><div><button onclick="publishDialog.close();selected=find('${esc(s.id)}').story;edit()">Re-edit</button><button class="danger" onclick="rejectQueued('${esc(s.id)}')">Reject</button></div></div>`).join(''):'<div class="empty">Publish Queue is empty.</div>');publishDialog.showModal()}async function rejectQueued(id){if(confirm('Reject this queued story?')){await api('/api/control/reject',{id,reason:'rejected from publish queue'});await load();openQueue()}}
async function approveQueue(){let ids=[...document.querySelectorAll('.pub:checked')].map(x=>x.value);await api('/api/control/approve-queue',{ids});publishDialog.close();q('result').textContent=`Queue approved · ${ids.length} ready to publish`;await load()}
async function clearQueue(){if(!confirm('Clear all Publish Queue checkmarks? Stories will remain in the queue.'))return;await api('/api/control/clear-queue',{});publishDialog.close();q('result').textContent='Publish Queue selections cleared; stories retained.';await load()}
async function publishApproved(){let count=state.publish_approved_count;if(!count)return alert('Approve at least one story in Open Queue first.');let finalCount=state.published_count+count;if(!confirm(`Publish ${count} approved stories to AInetWatch.com now?\n\nCurrently published: ${state.published_count}\nAfter publishing: ${finalCount}`))return;q('publishMasterBtn').disabled=true;q('operation').textContent=`Publishing ${count} stories…`;q('result').textContent='Building and deploying AInetWatch.com. Please wait.';try{let o=await api('/api/control/publish',{});await load();q('operation').textContent='Publish complete';q('result').textContent=`Published ${o.published}${o.version_id?' · Version '+o.version_id:''}`}catch(e){q('operation').textContent='Publish failed';let detail=(e.details||'').trim().split('\n').slice(-3).join(' · ');q('result').textContent=e.message+(detail?' · '+detail:'')}finally{q('publishMasterBtn').disabled=!(state&&state.publish_approved_count)}}
async function restartServer(){if(!confirm('Restart the local AINWA server now?'))return;let oldToken=csrf;q('operation').textContent='Restarting AINWA server…';await api('/api/control/restart-server',{});let retry=()=>fetch('/api/control',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{if(o&&o.csrf_token&&o.csrf_token!==oldToken)location.reload();else setTimeout(retry,500)}).catch(()=>setTimeout(retry,500));setTimeout(retry,700)}
async function killServer(){if(!confirm('Stop the local AINWA server? Use the wrapped shortcut to start it again.'))return;await api('/api/control/kill-server',{});q('operation').textContent='AINWA server stopped';q('result').textContent='Use the wrapped shortcut to restart AINWA.'}
async function sourceStories(){if(!confirm('Run the complete Source workflow now? This fetches sources and uses AI for Candidate selection.'))return;try{await api('/api/control/source',{});q('result').textContent='Source started';await load();watchOperation()}catch(e){q('result').textContent=e.message}}
async function recoverScan(){if(!confirm('Load up to 60 stories from the last saved scan? This makes no AI call.'))return;try{q('result').textContent='Loading last scan…';let o=await api('/api/control/recover-scan',{});q('result').textContent=`Loaded ${o.scanned_added} Scanned · no AI call`;await load()}catch(e){q('result').textContent=e.message}}
async function manualAdd(){let url=prompt('Article URL');if(!url)return;let source_name=prompt('Source name');if(!source_name)return;let original_headline=prompt('Original headline');if(!original_headline)return;let o=await api('/api/control/manual',{url,source_name,original_headline});await load();choose('scanned',o.story.id);edit()}
async function lazyUpdate(){if(!confirm('Ask AI to select 2–4 Candidates after reviewing the current homepage?'))return;let o=await api('/api/control/lazy-update',{});alert(`Lazy Update selected ${o.selected_ids.length} stories. Review each in Editorial, generate its tooltip, and approve it to Publish Queue.\n\n${o.rationale||''}`);await load();choose('candidates',o.selected_ids[0])}
function mobile(n){document.querySelectorAll('.column:not(.editorial)').forEach(x=>x.classList.toggle('mobile-active',x.dataset.col===n))}load().catch(e=>q('result').textContent=e.message);setInterval(()=>load().catch(()=>{}),15000);
</script></body></html>
