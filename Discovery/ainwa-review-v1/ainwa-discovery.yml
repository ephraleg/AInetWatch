version: 1
system: AINWA
purpose: Lightweight discovery registry and policy for AInetWatch news sourcing.
discovery_policy:
  registry_first: true
  open_web_default: false
  ingestion_policy:
    regular_run:
      tiers: [1, 2]
      requires: [enabled, feed_url]
      note: >
        Sources must be enabled: true, tier 1 or 2, and have a valid non-empty
        feed_url to be fetched on every regular run.
    deferred:
      tiers: [3, 4]
      note: >
        Tier 3 and Tier 4 sources are configured and enabled but not fetched on
        regular runs yet.
    inactive:
      note: >
        Sources without a feed_url are configured but produce no items until a
        feed is added. No feed_url values are invented — they must be verified
        before setting.
  access_policy:
    note: >
      Preselection scoring prefers free sources and meaningfully penalizes paywalled
      ones. High-impact paywalled stories are never automatically excluded.
      access: free > unknown > mixed > paywalled in scoring weight.
  discovery_only:
    may_generate_leads: true
    may_be_final_source: false
  source_resolution:
    before_human_review: true
    preferred_final_roles:
    - Primary Source
    - Original Reporting
    rule: Resolve promising leads to a Primary Source or Original Reporting source whenever one exists.
  top_story_selection:
    selector: Claude
    maximum_stories: 20
    criteria:
    - importance
    - timeliness
    - novelty
    - source_quality
    - reader_relevance
    - non_duplication
    external_reviewers:
    - Grok
    - Gemini
    review_payload:
    - candidate_list
    - selection_criteria
    - Claude_rationale
    review_mode: advisory
    blocking: false
    failure_rule: If an external reviewer is unavailable, continue to human review rather than block the workflow.
  paywalls:
    disqualifying: false
    prefer_equally_authoritative_accessible_source: true
    accepted_paywall_story_tag: paywall
