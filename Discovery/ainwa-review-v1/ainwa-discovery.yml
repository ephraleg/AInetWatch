version: 1
system: AINWA
purpose: Lightweight discovery registry and policy for AInetWatch news sourcing.
discovery_policy:
  registry_first: true
  open_web_default: false
  priority_schedule:
    high: every_discovery_run
    medium: reduced_frequency
    low: daily_or_overflow_sweep
  discovery_only:
    may_generate_leads: true
    may_be_final_source: false
  source_resolution:
    before_human_review: true
    preferred_final_roles:
    - Primary Source
    - Original Reporting
    rule: Resolve promising leads to a Primary Source or Original Reporting source whenever one exists.
  top_story_selection:
    selector: Claude
    maximum_stories: 12
    criteria:
    - importance
    - timeliness
    - novelty
    - source_quality
    - reader_relevance
    - non_duplication
    external_reviewers:
    - Grok
    - Gemini
    review_payload:
    - candidate_list
    - selection_criteria
    - Claude_rationale
    review_mode: advisory
    blocking: false
    failure_rule: If an external reviewer is unavailable, continue to human review rather than block the workflow.
  paywalls:
    disqualifying: false
    prefer_equally_authoritative_accessible_source: true
    accepted_paywall_story_tag: paywall
